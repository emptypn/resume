projects:
  - title: Archon — Multi-Platform AI Assistant
    tech: |
      Python (asyncio), SQLite, systemd, GitHub Actions, Telegram / WhatsApp / Gmail /
      Google Calendar APIs
    intro: |
      Autonomous agent spanning WhatsApp, Telegram, and Gmail: it ingests messages,
      triages them, and acts through a tool-calling loop, operated entirely from a
      Telegram bot. ~8,900 lines of Python.
    bullets:
      - |
        Put a 78-tool agent catalog behind a scope-filtering registry that hides
        privileged tools from the model entirely, so safety never depends on the model
        refusing. A confirmation gate routes every state-mutating action (send, email,
        calendar) through owner approval; new chats default to confirm-required.
      - |
        Normalized five LLM provider backends (Anthropic content blocks, OpenAI and
        OpenRouter function-call JSON, Gemini Part objects, a sandboxed Claude Code
        subprocess) behind one interface, with a per-call cost model and a hard daily
        budget gate. Prompt caching on the system block transitively caches all 78 tool
        schemas.
      - |
        Ran eight subsystems as independently supervised asyncio tasks with
        per-subsystem exponential backoff (5s→300s), so one failing integration cannot
        take down the others. All durable state lives in SQLite (WAL); restarts are
        safe by construction.
      - |
        Deployed with zero inbound application ports on a systemd-sandboxed VM
        (ProtectSystem=strict, NoNewPrivileges), CI that gates deploys on the test
        suite, and an egress monitor that alerts on any unrecognized outbound host.
  - title: Operating System Kernel
    tech: C/C++, AArch64 assembly, QEMU, Docker
    note: in progress
    intro: |
      Kernel written from scratch for 64-bit ARM (AArch64), targeting a working
      understanding of privilege rings, virtual memory, and the boot path.
    bullets:
      - |
        Containerized the cross-compiler toolchain in Docker with QEMU for execution,
        giving reproducible builds across macOS and Windows and enabling CI checks on
        every commit.
  - title: Client-Server Application
    tech: Python, sockets
    intro: |
      Distributed system over raw sockets with a custom application-level protocol on
      TCP/IP, concurrent client handling, and structured error handling.
  - title: Retail Price Scraper
    tech: Python, web scraping
    intro: |
      Reverse-engineered web requests to work around anti-scraping measures, with data
      normalization and structured storage for analysis.

