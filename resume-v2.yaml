summary: |
  Presently I’m the sole developer, and in practice the product owner, of an LLM engine at
  XM Cyber that audits customers’ attack-path configurations for an enterprise security
  platform. I scoped what it does and built the verification and privacy layers that
  make it safe to run in customer environments. My background is low-level systems and
  reverse engineering from Israel’s Magshimim National Cyber Program.

experience:
  - title: Solutions Developer
    org: XM Cyber, Tel Aviv
    dates: April 2026 – Present
    intro: |
      Sole developer of an LLM-powered configuration-hygiene system for an enterprise
      attack-path management platform. It audits every attack scenario in a customer
      environment, flags the ones that are broken, redundant, misnamed, or silently
      producing nothing, and generates prioritized, environment-specific remediation
      advice. Advisory-only by design. Also shipped two AI agents into the product;
      currently migrating the system from proof of concept into the production codebase.
    groups:
      - heading: Product ownership
        bullets:
          - lead: Took an open-ended problem to a shipping product.
            text: |
              Started from a vague complaint about customer attack scenarios
              tending to silently rot over time. Turned that into a defined product, including
              prioritizng findings from the security team’s perspective defining the constraints 
              which the system has to comply to.
          - lead: Made the scoping call that made adoption possible.
            text: |
              Chose advisory-and-read-only over auto-remediation and backed it with a
              five-layer customer data safety guarantee. Decided to trade the  
              capabilities for the confidence that enabled stakeholders to allow to
              run inside a customer environment.
          - lead: Turned loads of data into actionable insights
            text: |
              Deduplication, root-cause suppression, and confidence-based ranking collapse
              two hundred symptoms of one cause into the handful of issues a team should
              actually fix. Prioritization is the core product problem here, and I treated
              it that way.
          - lead: Presentation targeted at the real audience.
            text: |
              A report-contract gate turns every class of bad output found in manual
              review into a deterministic pre-publish check. A jargon linter keeps
              findings actionable for non-technical stakeholders.
          - lead: Accuracy KPIs and Thresholds
            text: |
              Defined quantifiable accuracy KPIs and thresholds and made sure the results include
              confidence level estimates.
          - lead: Documentation
            text: |
              Built a 37-file internal knowledge base and two agent skills make the system
              handoff-ready so it is possible to drill down into the reasoning behind the decisions 
              the system makes.
      - heading: Engineering
        bullets:
          - lead: Layered Analysis Engine 
            text: |
              Architected a four-layer analysis engine (data, comparison, detection,
              orchestration) with enforced import boundaries and 16 independent detectors:
              6 LLM-backed, 10 fully deterministic. ~1,100 automated tests back it,
              including false-positive regression suites where every adjudicated false
              positive is encoded so it can never reappear.
          - lead: Layered Analysis Engine 
            text: |
              Built a "propose, verify, revise, revert" loop that makes LLM-authored advice
              safe to ship. The model returns structured JSON; nine deterministic
              verifiers check every claim against platform ground truth; failures get one
              targeted revision round, then fall back to safe generic text. Every number
              in the final output is computed in code and is reproducible.
          - lead: Layered Analysis Engine 
            text: 
              Designed the anonymization layer that makes LLM use viable in a security
              product: deterministic regex masking with stable hash pseudonyms, a payload
              contract enforced at type-check and at runtime so no client can skip
              anonymization, and a per-run deny-list checked at a single chokepoint that
              aborts on any leak. An offline audit tool proves compliance across a full
              customer environment with zero LLM calls.
          - lead: Layered Analysis Engine 
            text: | 
              Implemented an entity-inventory query layer and tool-calling loop that
              ground the model’s answers in real data: a lazily-built SQLite index over
              compressed NDJSON, a boolean expression-tree selector parser, and five
              read-only tools exposed in-process and over MCP (JSON-RPC 2.0). When the
              index cannot evaluate a query, the answer is unknown. A misleading 0 would
              be worse.
          - lead: Layered Analysis Engine 
            text: |
              Optimized the comparison hot path with a C extension (bitset Jaccard,
              popcount intrinsics, size pre-filter), chosen by benchmarking 10
              implementations against each other for identical results.
    stack: Python (asyncio, httpx, Pydantic, pytest), C, SQLite, Bash, Git, MCP, LLM APIs

