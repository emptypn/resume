# Static deploy (2026-08-25). The committed index.html and PDFs ARE the site.
#
# The previous workflow rebuilt index.html and the PDFs from this repo's resume.yaml on
# every push — which silently overwrote the canonical files the first time they were
# published from outside: the site kept serving the old resume while the push that
# updated it showed green. The render source of truth now lives in the jobpipe
# pipeline (userdata/profile/master-resume.yaml); this repo only hosts the output.
# create_pdf.py / resume.yaml / resume.html.template remain in-tree as the retired
# toolchain, deliberately not executed.

name: Deploy Resume Site

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
