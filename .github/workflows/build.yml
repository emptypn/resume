# Render-and-deploy (2026-08-26). resume-v2.yaml is the source of truth: every push
# to master re-renders index.html + resume.pdf + resume-v2.pdf from it
# (render/build_site.py), commits the result back, and deploys — one job, because a
# GITHUB_TOKEN bot commit cannot trigger a separate deploy workflow.
#
# The committed files still ARE the site (the 2026-08-25 invariant); the render step
# keeps them in lockstep with the YAML instead of trusting hand updates. The hazard
# that forced the static deploy — a stale in-repo yaml overwriting canonical files
# published from outside — is gone by definition: the YAML in this repo is now the
# canonical source, edited via the resume-v2 branch or directly on master.
#
# No render loop: the bot's own push doesn't fire a new push event, and this run's
# deploy already uses the freshly rendered files.

name: Render and Deploy Resume Site

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          pip install jinja2 pyyaml playwright
          playwright install --with-deps chromium

      - name: Render site from resume-v2.yaml
        run: python render/build_site.py

      - name: Commit rendered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html resume.pdf resume-v2.pdf
          if git diff --cached --quiet; then
            echo "rendered files unchanged"
          else
            git commit -m "chore: render site from resume-v2.yaml"
            git push
          fi

      - name: Drop build scratch before upload
        run: rm -rf render/build render/__pycache__

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
